name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript
        run: yarn tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test:unit

  e2e-tests:
    name: E2E Tests (Core Flow)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create test env file
        run: |
          cp .env.test.example .env.test || true
          # Set minimal env vars for CI testing (use Astro PUBLIC_ prefix, not Next.js NEXT_PUBLIC_)
          echo "ENV=test" >> .env.test
          echo "PLAYWRIGHT_TEST=1" >> .env.test
          echo "PUBLIC_SUPABASE_URL=http://localhost:54321" >> .env.test
          echo "PUBLIC_SUPABASE_ANON_KEY=test-anon-key" >> .env.test
          echo "SUPABASE_SERVICE_ROLE_KEY=test-service-role-key" >> .env.test
          echo "STRIPE_SECRET_KEY=sk_test_dummy" >> .env.test
          echo "STRIPE_WEBHOOK_SECRET=whsec_test_dummy" >> .env.test
          echo "PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_dummy" >> .env.test

      - name: Run api tests
        run: yarn test:api
        env:
          ENV: test
          PLAYWRIGHT_TEST: 1
          CI: true
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E core flow tests
        run: yarn playwright test tests/e2e/core-app-flow.ci.e2e.spec.ts --project=chromium --reporter=list
        env:
          ENV: test
          PLAYWRIGHT_TEST: 1
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
